[package]
name = "shiro"
version = "0.1.0"
edition = "2021"
description = "Shiro - a lobby client for Zero-K"
rust-version = "1.77"

[lib]
name = "shiro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.7"
# TCP keepalive: tokio does not expose the socket option itself.
socket2 = { version = "0.6", features = ["all"] }
base64 = "0.22"

[profile.release]
strip = true
lto = true
opt-level = "s"
