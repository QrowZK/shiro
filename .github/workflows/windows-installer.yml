# Builds the Windows installer.
#
# The bundle cannot be cross-compiled: NSIS packaging and WebView2 need the
# MSVC toolchain, so this runs on a Windows runner and uploads the installer
# as an artifact. Run it from the Actions tab, or let it run on a push to a
# branch that changes the app.
name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main, main-u3zpp0]
    paths:
      - "src/**"
      - "src-tauri/**"
      # tools/ gates the build: `npm test` runs the icon check from here.
      - "tools/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".gitattributes"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # The Rust build is the slow half; cache it across runs.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Cheap, and a broken build is worth catching before the ten-minute part.
      - name: Unit tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Not through scripts/tauri.ps1: that exists to find MSVC on a developer's
      # machine, and the runner already has it on PATH.
      - name: Build installer
        run: npm run tauri -- build

      - name: Collect the installer
        shell: pwsh
        run: |
          $nsis = "src-tauri/target/release/bundle/nsis"
          Get-ChildItem $nsis -Filter *.exe | ForEach-Object {
            "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: shiro-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/shiro.exe
          if-no-files-found: error
          retention-days: 30

      # Artifacts expire and need a GitHub login to fetch. A rolling prerelease
      # gives the same file a stable, public URL:
      #   https://github.com/<repo>/releases/download/dev/Shiro_<version>_x64-setup.exe
      - name: Publish the dev release
        if: github.ref == 'refs/heads/main-u3zpp0' || github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter *.exe |
            Select-Object -First 1
          $notes = @"
          Unsigned development build of Shiro, from commit ${{ github.sha }}.

          Per-user install, no admin prompt. Windows SmartScreen will warn about an
          unknown publisher - that is the missing code signature, not a problem with
          the download. Requires an existing Zero-K installation for the engine,
          games and maps.
          "@
          gh release delete dev --yes 2>$null
          gh release create dev $exe.FullName `
            --title "Shiro - development build" `
            --notes $notes `
            --prerelease `
            --target ${{ github.sha }}
          "Published $($exe.Name)"
