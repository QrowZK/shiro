# Builds Shiro for Windows and Linux, and publishes the `dev` release.
#
# One workflow rather than two because there is one update manifest. Two
# workflows writing `latest.json` would race, and the loser's platform would
# quietly vanish from it - so both platforms are built here and published once,
# by a job that has both.
#
# Linux packaging cannot be cross-compiled: Tauri links against WebKitGTK and
# glibc headers that only exist on the target, so the Linux job is the only
# place those artifacts can come from.
#
# NOTE: nothing in this app has ever been RUN on Linux. A green build means it
# compiles and packages, not that it works.
name: Build and release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "src/**"
      - "src-tauri/**"
      # tools/ gates the build: `npm test` runs the icon check from here, so a
      # change in tools/ can break CI without touching anything else.
      - "tools/**"
      - ".gitattributes"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - ".github/workflows/build-and-release.yml"

# Only for the publish job below. Everything else here reads.
permissions:
  contents: write

# The version every job stamps. `github.run_number` only ever increases for a
# workflow, and computing it in each job rather than passing it around means the
# two platforms cannot disagree about what they built.
#
# The minor is 2 rather than 1 because run_number is scoped to a *workflow*, and
# this file replaced windows-installer.yml - so its counter restarted at 1 and
# published 0.1.2 over 0.1.46. Every version must be greater than every version
# before it or an update check answers "no" forever, so the series moved up
# instead of trying to resume a counter that is gone.
#
# Renaming this file again would restart it again. Bump the minor if that
# happens; do not try to make run_number continue.
env:
  SHIRO_VERSION: 0.2.${{ github.run_number }}
  # Whether this run is allowed to publish. Main only: a dev build is a public
  # download link, and publishing an unreviewed branch to it would be a way to
  # hand somebody code nobody has looked at.
  PUBLISHING: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Stamped rather than committed, so main stays on the base version and
      # there is no version-bump commit in the history. Only when publishing:
      # renumbering a pull request build would just make the artifact confusing.
      - name: Stamp the build version
        if: env.PUBLISHING == 'true'
        shell: pwsh
        run: |
          $conf = "src-tauri/tauri.conf.json"
          $json = Get-Content $conf -Raw | ConvertFrom-Json
          $json.version = $env:SHIRO_VERSION
          $json | ConvertTo-Json -Depth 32 | Set-Content $conf -Encoding utf8
          npm version $env:SHIRO_VERSION --no-git-tag-version --allow-same-version | Out-Null
          "Stamped $env:SHIRO_VERSION"

      # Cheap, and a broken build is worth catching before the ten-minute part.
      - name: Unit tests
        run: npm test

      # The screens are .jsx and checkJs is off, so nothing else here looks
      # at them. This catches the one thing in that gap that is a crash
      # rather than an opinion: a name that was never imported.
      - name: Undefined identifiers
        run: npm run check:names

      - name: Types
        run: npm run typecheck

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      # Updater artifacts are built only when there is a key to sign them with.
      #
      # `createUpdaterArtifacts` is not in tauri.conf.json for a reason: with it
      # on and no private key, the bundler fails outright - "a public key has
      # been found, but no private key" - which would break every pull request
      # from a fork and every checkout without the secret. So it lives in an
      # overlay applied here, on the runs that have the key.
      - name: Build
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            "Signing key present - building updater artifacts."
            npm run tauri -- build --config src-tauri/updater.json
          } else {
            "No signing key - building the installer only."
            npm run tauri -- build
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 30

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 on Linux needs the webview and tray libraries at build time.
      # 22.04 carries webkit2gtk-4.1, which is what Tauri v2 wants; 20.04 only
      # has 4.0 and will not link.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file

      - name: Install dependencies
        run: npm ci

      # The same version the Windows job stamps. Without this every Linux
      # package ever built claimed 0.1.0, so apt considered a newer one already
      # installed and the updater had nothing to compare.
      - name: Stamp the build version
        if: env.PUBLISHING == 'true'
        run: |
          node -e '
            const fs = require("fs");
            const p = "src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.env.SHIRO_VERSION;
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + "\n");
          '
          npm version "$SHIRO_VERSION" --no-git-tag-version --allow-same-version >/dev/null
          echo "Stamped $SHIRO_VERSION"

      - name: Unit tests
        run: npm test

      # The screens are .jsx and checkJs is off, so nothing else here looks
      # at them. This catches the one thing in that gap that is a crash
      # rather than an opinion: a name that was never imported.
      - name: Undefined identifiers
        run: npm run check:names

      - name: Types
        run: npm run typecheck

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "Signing key present - building updater artifacts."
            npm run tauri -- build --config src-tauri/updater.json
          else
            echo "No signing key - building the packages only."
            npm run tauri -- build
          fi

      - name: Collect the packages
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.sig' \) \
            -printf '%f  %s bytes\n'

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [windows, linux]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-22.04
    steps:
      # `gh release` resolves the repository from the checkout. Without this the
      # publish step fails with "not a git repository" after both platforms have
      # already built, which is a twenty-minute way to find out.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Build the update manifest
        run: |
          set -euo pipefail
          ls -R dist

          # Every signature found, rather than filenames spelled out here.
          # Tauri decides what it signs and has changed its mind before - v1
          # signed a .nsis.zip, v2 signs the installer - and a publish step that
          # guesses wrong silently ships no update at all.
          platforms='{}'
          while IFS= read -r sig; do
            artifact="${sig%.sig}"
            if [ ! -f "$artifact" ]; then
              echo "::warning::$sig has no artifact beside it; skipping"
              continue
            fi
            name="$(basename "$artifact")"
            case "$name" in
              *.exe)      platform=windows-x86_64 ;;
              *.AppImage) platform=linux-x86_64 ;;
              *)          echo "::warning::no platform known for $name; skipping"; continue ;;
            esac
            echo "signed: $name -> $platform"
            entry=$(jq -n --arg s "$(cat "$sig")" \
              --arg u "https://github.com/${{ github.repository }}/releases/download/dev/$name" \
              --arg p "$platform" '{($p): {signature: $s, url: $u}}')
            platforms=$(printf '%s\n%s\n' "$platforms" "$entry" | jq -s 'add')
          done < <(find dist -type f -name '*.sig' | sort)

          if [ "$(echo "$platforms" | jq 'length')" -eq 0 ]; then
            echo "::warning::No signatures - TAURI_SIGNING_PRIVATE_KEY is probably unset."
            echo "::warning::Publishing the packages without an update manifest."
          else
            jq -n --arg v "$SHIRO_VERSION" \
              --arg n "Development build from commit ${{ github.sha }}." \
              --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson p "$platforms" \
              '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest.json
            echo "--- latest.json ---"
            cat latest.json
          fi

      - name: Publish the dev release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$SHIRO_VERSION"

          # Everything a person downloads, plus the manifest the app reads.
          # The .sig files are not uploaded: their contents are already in the
          # manifest, and a stray signature beside a release is just confusing.
          assets=$(find dist -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) | sort)
          test -n "$assets"

          # An array, so a path is one argument whatever it contains.
          mapfile -t asset_list <<< "$assets"
          # Not a bare `&&`: under `set -e` a false test would end the step, and
          # "there is no manifest" is a normal outcome when the key is absent.
          if [ -f latest.json ]; then
            asset_list+=(latest.json)
          fi

          notes=$(cat <<'EOF'
          Unsigned development build of Shiro, from commit ${{ github.sha }}.

          Per-user install, no admin prompt. Windows SmartScreen will warn about an
          unknown publisher - that is the missing code signature, not a problem with
          the download.

          Needs an existing Zero-K installation for the engine. Shiro downloads
          games and maps itself, including the community content pr-downloader
          cannot reach.

          Linux packages are built but have never been run by anybody. Reports welcome.
          EOF
          )

          # Updated in place rather than deleted and recreated: a delete that
          # fails leaves a create that cannot succeed, and there is never a
          # moment when the download link people have does not exist.
          if gh release view dev >/dev/null 2>&1; then
            gh release edit dev --title "Shiro - development build" --notes "$notes" --prerelease

            # Package filenames carry the version, so last build's do not get
            # overwritten - they just sit there looking current.
            #
            # This takes latest.json with it when a build produces no manifest,
            # and that is deliberate: the installer the old manifest points at
            # has just been removed as stale, so leaving it would offer an
            # update that 404s halfway through. No manifest at least fails
            # before downloading anything.
            keep=$(printf '%s\n' "${asset_list[@]}" | xargs -n1 basename | sort -u)
            for old in $(gh release view dev --json assets --jq '.assets[].name'); do
              if ! echo "$keep" | grep -qx "$old"; then
                echo "Removing stale asset $old"
                gh release delete-asset dev "$old" --yes
              fi
            done

            gh release upload dev "${asset_list[@]}" --clobber
          else
            gh release create dev "${asset_list[@]}" \
              --title "Shiro - development build" \
              --notes "$notes" \
              --prerelease \
              --target "${{ github.sha }}"
          fi

          echo "Published as $SHIRO_VERSION"
