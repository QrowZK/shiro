# Builds the Linux packages.
#
# This cannot be done from the Windows machine the project is developed on:
# Tauri does not support cross-compiling to Linux, because the build links
# against WebKitGTK and glibc headers that only exist on the target. So Linux
# artifacts come from here or not at all.
#
# Sibling of windows-installer.yml; kept as a separate workflow rather than a
# matrix because the system dependencies and the artifact set have nothing in
# common.
#
# NOTE: nothing in this app has ever been RUN on Linux. A green build here means
# it compiles and packages, not that it works. See docs/DESIGN_HANDOFF.md §4 on
# WebKitGTK, which renders differently from the WebView2/Chromium the design was
# verified against.
name: Linux build

on:
  workflow_dispatch:
  push:
    # The feature branch is listed so the first Linux packages can be produced
    # before this merges — nothing in the app has ever been built for Linux, so
    # waiting until after the merge would be finding out too late.
    branches: [main, fix/keepalive-ci-and-chat-scroll]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.js"
      - "tools/**"
      - ".github/workflows/linux-build.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri v2 on Linux needs the webview and tray libraries at build time.
      # 22.04 carries webkit2gtk-4.1, which is what Tauri v2 wants; 20.04 only
      # has 4.0 and will not link.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            file

      - name: Install dependencies
        run: npm ci

      # Cheap, and a broken build is worth catching before the slow part.
      - name: Unit tests
        run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build packages
        run: npm run tauri -- build

      - name: Collect the packages
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) \
            -printf '%f  %s bytes\n'

      - uses: actions/upload-artifact@v4
        with:
          name: shiro-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/shiro
          if-no-files-found: error
          retention-days: 30
